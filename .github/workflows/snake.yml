name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: farahyusni
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#8B7355
            dist/github-contribution-grid-snake-dark.svg?color_snake=#D4A5A5&color_dots=#2a2f3a,#6B5B45,#8B7355,#A3B18A,#D4A5A5

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
